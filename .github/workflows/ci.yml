name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with Ruff
        run: uv run ruff check src/ tests/

      - name: Format check with Ruff
        run: uv run ruff format --check src/ tests/

      - name: Type check with MyPy
        run: uv run mypy src/smartcsv/ --ignore-missing-imports

      - name: Run tests
        run: uv run pytest --cov=src/smartcsv --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Verify entrypoint imports
        run: uv run python -c "import sys; sys.path.insert(0,'src'); from smartcsv.app import main; print('Entrypoint OK')"

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t smartcsv-analyst:latest .

      - name: Verify Docker image
        run: docker run --rm smartcsv-analyst:latest python -c "import sys; sys.path.insert(0,'src'); import smartcsv; print(smartcsv.__version__)"
